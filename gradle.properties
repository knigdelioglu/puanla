org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Reuse cacheable task outputs and schedule independent tasks concurrently.
org.gradle.caching=true
org.gradle.parallel=true
# Reuse task configuration on repeated local and CI invocations.
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
ksp.useKSP2=false

# Public immutable AAR: published with POM + Gradle module metadata.
# Keep versions pinned; review newer Compose releases before promotion.
composeDesignSystemVersion=0.1.2
composeUsePublishedByDefault=true
