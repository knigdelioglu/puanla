name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compose_published_version:
        description: 'Optional published Compose Maven version for a compatibility check'
        required: false
        type: string
      compose_legacy_sources:
        description: 'Emergency rollback: build from the previously pinned Compose source commit'
        required: false
        type: boolean
        default: false

# CI builds exactly one Puanla revision and one explicitly selected library
# version; Compose's moving main can never change an ordinary release.
concurrency:
  group: puanla-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      compose_mode: ${{ steps.dependency.outputs.mode }}
      compose_version: ${{ steps.dependency.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Select published AAR or explicit source rollback
        id: dependency
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.compose_published_version }}
          LEGACY_SOURCES: ${{ inputs.compose_legacy_sources }}
        run: |
          set -euo pipefail
          if [[ "${LEGACY_SOURCES:-false}" == "true" ]]; then
            [[ -z "${REQUESTED_VERSION:-}" ]] || {
              echo "::error::Cannot override Maven version while using source rollback"
              exit 1
            }
            sha="$(tr -d '[:space:]' < .github/compose-design-system.sha)"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Invalid source rollback SHA"
              exit 1
            }
            echo "mode=source" >> "$GITHUB_OUTPUT"
            echo "version=$sha" >> "$GITHUB_OUTPUT"
            echo "compose_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "::notice::Using explicit Compose source rollback $sha"
          else
            version="${REQUESTED_VERSION:-$(sed -n 's/^composeDesignSystemVersion=//p' gradle.properties)}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
              echo "::error::Invalid published Compose version"
              exit 1
            }
            if [[ -n "${REQUESTED_VERSION:-}" ]]; then
              echo "ORG_GRADLE_PROJECT_composePublishedVersion=$version" >> "$GITHUB_ENV"
            else
              grep -qx 'composeUsePublishedByDefault=true' gradle.properties || {
                echo "::error::Published Compose must be the default for normal CI builds"
                exit 1
              }
            fi
            echo "mode=maven" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "::notice::Verifying immutable Compose Maven AAR $version"
          fi
      - name: Checkout pinned Compose source only for explicit rollback
        if: steps.dependency.outputs.mode == 'source'
        uses: actions/checkout@v4
        with:
          repository: knigdelioglu/compose-design-system
          ref: ${{ steps.dependency.outputs.compose_sha }}
          path: compose-design-system
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Confirm the resolved published AAR version
        if: steps.dependency.outputs.mode == 'maven'
        env:
          EXPECTED_VERSION: ${{ steps.dependency.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew :app:dependencyInsight --dependency compose-design-system --configuration debugRuntimeClasspath --no-daemon > compose-dependency-resolution.txt
          grep -F "com.knigdelioglu:compose-design-system:$EXPECTED_VERSION" compose-dependency-resolution.txt || {
            echo "::error::Gradle did not resolve the selected Compose AAR $EXPECTED_VERSION"
            cat compose-dependency-resolution.txt
            exit 1
          }
      - name: Verify unit tests and package APKs
        env:
          MODE: ${{ steps.dependency.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$MODE" == "source" ]]; then
            args+=("-PcomposeUsePublishedByDefault=false" "-PcomposeDesignSystemDir=$GITHUB_WORKSPACE/compose-design-system/design-system")
          fi
          ./gradlew test :app:assembleDebug :app:assembleRelease --no-daemon "${args[@]}"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify tablet UI tests before publishing
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MODE: ${{ steps.dependency.outputs.mode }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            if [ "$MODE" = "source" ]; then
              ./gradlew :app:connectedDebugAndroidTest --no-daemon \
                -PcomposeUsePublishedByDefault=false \
                -PcomposeDesignSystemDir="$GITHUB_WORKSPACE/compose-design-system/design-system"
            else
              ./gradlew :app:connectedDebugAndroidTest --no-daemon
            fi
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: puanla-tablet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-main:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: puanla-tablet-debug-apk
          path: dist
      - name: Publish only tested AAR-backed main APK
        env:
          GH_TOKEN: ${{ github.token }}
          COMPOSE_VERSION: ${{ needs.verify.outputs.compose_version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.1-tablet.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "dist/app-debug.apk#Puanla-$TAG-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Puanla 0.1.1 Tablet Önizleme" \
            --notes "Birim, APK ve tablet emülatör testleri başarılı. Compose Maven AAR: $COMPOSE_VERSION. Debug APK her CI çalışmasında farklı anahtarla imzalanabilir; mevcut verilerinizi yedekleyin."
