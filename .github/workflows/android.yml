name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create runs only for successful main pushes
    steps:
      - uses: actions/checkout@v4
      - name: Checkout shared Compose Design System
        uses: actions/checkout@v4
        with:
          repository: knigdelioglu/compose-design-system
          ref: main
          path: compose-design-system
          # This is a private repository. Set COMPOSE_DESIGN_SYSTEM_TOKEN to a
          # fine-grained read-only token with Contents access to that repository.
          token: ${{ secrets.COMPOSE_DESIGN_SYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Unit tests and debug and release builds
        run: ./gradlew test :app:assembleDebug :app:assembleRelease --no-daemon -PcomposeDesignSystemDir="$GITHUB_WORKSPACE/compose-design-system/design-system"
      - uses: actions/upload-artifact@v4
        with:
          name: puanla-tablet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish built tablet APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.1-tablet.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "app/build/outputs/apk/debug/app-debug.apk#Puanla-${TAG}-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Puanla 0.1.1 Tablet Önizleme" \
            --notes "Güncel main sürümünden oluşturulan, derleme ve birim testleri başarılı debug APK. Tablet emülatör testleri ayrıca yürütülür; bu Release bunların geçtiğini garanti etmez. Debug imzalıdır; eski uygulamayı kaldırmadan önce verilerinizi yedekleyin."
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tablet UI instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon -PcomposeDesignSystemDir="$GITHUB_WORKSPACE/compose-design-system/design-system"
