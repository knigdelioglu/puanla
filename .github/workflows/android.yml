name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compose_published_version:
        description: 'Optional public Maven version for independent AAR compatibility test'
        required: false
        type: string
  repository_dispatch:
    types: [compose-design-system-updated]
  schedule:
    - cron: '19 * * * *'

# Serialize main builds and dependency promotions so a promotion never
# races another build/release started from the same workflow.
concurrency:
  group: puanla-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      puanla_sha: ${{ steps.refs.outputs.puanla_sha }}
      compose_sha: ${{ steps.refs.outputs.compose_sha }}
      should_build: ${{ steps.refs.outputs.should_build }}
      promote: ${{ steps.refs.outputs.promote }}
      published_version: ${{ steps.refs.outputs.published_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned or candidate Compose revision
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PUBLISHED_VERSION: ${{ inputs.compose_published_version }}
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .github/compose-design-system.sha)"
          [[ "$pinned" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid Compose pin"; exit 1; }
          puanla_sha="$(git rev-parse HEAD)"
          compose_sha="$pinned"
          should_build=true
          promote=false
          published_version="${REQUESTED_PUBLISHED_VERSION:-}"
          if [[ -n "$published_version" ]]; then
            [[ "$published_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
              echo "::error::Invalid published Compose version"; exit 1;
            }
          fi

          # Every ordinary Puanla build uses the last validated pin.
          # Dispatch, manual and scheduled runs test a newer upstream revision.
          if [[ -n "$published_version" ]]; then
            echo "::notice::Testing published Maven artifact $published_version without advancing source pin"
          elif [[ "$EVENT_NAME" == "repository_dispatch" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            compose_sha="$(git ls-remote https://github.com/knigdelioglu/compose-design-system.git refs/heads/main | cut -f1)"
            [[ "$compose_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Cannot resolve upstream Compose main"; exit 1; }
            if [[ "$compose_sha" == "$pinned" ]]; then
              should_build=false
              echo "::notice::Compose already pinned at $pinned"
            else
              # Do not adopt a revision whose own Compose CI has not passed.
              # This also handles a push whose Android checks are still running.
              if ! curl --fail --silent --show-error --retry 2 \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/knigdelioglu/compose-design-system/actions/workflows/android.yml/runs?head_sha=$compose_sha&per_page=10" \
                | jq -e --arg sha "$compose_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | length > 0' > /dev/null; then
                should_build=false
                echo "::notice::Compose $compose_sha has no successful completed Android push workflow yet; will retry on next dispatch/poll."
              else
                promote=true
              fi
            fi
          fi
          {
            echo "puanla_sha=$puanla_sha"
            echo "compose_sha=$compose_sha"
            echo "should_build=$should_build"
            echo "promote=$promote"
            echo "published_version=$published_version"
          } >> "$GITHUB_OUTPUT"
          echo "Using Puanla $puanla_sha with Compose $compose_sha (build=$should_build, promote=$promote)"

  verify:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.puanla_sha }}
          path: puanla
      - name: Checkout exactly the resolved Compose revision
        if: ${{ needs.resolve.outputs.published_version == '' }}
        uses: actions/checkout@v4
        with:
          repository: knigdelioglu/compose-design-system
          ref: ${{ needs.resolve.outputs.compose_sha }}
          path: compose-design-system
          persist-credentials: false
      - name: Enable independently published Compose AAR smoke mode
        if: ${{ needs.resolve.outputs.published_version != '' }}
        env:
          LIBRARY_VERSION: ${{ needs.resolve.outputs.published_version }}
        run: echo "ORG_GRADLE_PROJECT_composePublishedVersion=$LIBRARY_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Verify unit tests and package APKs
        working-directory: puanla
        run: ./gradlew test :app:assembleDebug :app:assembleRelease --no-daemon -PcomposeDesignSystemDir="$GITHUB_WORKSPACE/compose-design-system/design-system"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify tablet UI tests before publishing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: cd puanla && ./gradlew :app:connectedDebugAndroidTest --no-daemon -PcomposeDesignSystemDir="$GITHUB_WORKSPACE/compose-design-system/design-system"
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: puanla-tablet-debug-apk
          path: puanla/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  promote-compose:
    needs: [resolve, verify]
    if: needs.resolve.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.puanla_sha }}
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: puanla-tablet-debug-apk
          path: dist
      - name: Adopt validated Compose commit without racing changes to main
        env:
          EXPECTED_PUANLA_SHA: ${{ needs.resolve.outputs.puanla_sha }}
          COMPOSE_SHA: ${{ needs.resolve.outputs.compose_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$EXPECTED_PUANLA_SHA" ]] || {
            echo "::error::Puanla main changed during verification; no promotion or release. A later poll will retry."
            exit 1
          }
          printf '%s\n' "$COMPOSE_SHA" > .github/compose-design-system.sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/compose-design-system.sha
          git commit -m "chore(deps): adopt verified Compose $COMPOSE_SHA [skip ci]"
          git push origin HEAD:main
          echo "PROMOTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish APK from verified dependency promotion
        env:
          GH_TOKEN: ${{ github.token }}
          COMPOSE_SHA: ${{ needs.resolve.outputs.compose_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.1-tablet.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "dist/app-debug.apk#Puanla-${TAG}-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$PROMOTED_COMMIT" --prerelease \
            --title "Puanla 0.1.1 Tablet Önizleme" \
            --notes "Puanla birim, APK derleme ve Android emülatör testlerinden geçen Compose Design System $COMPOSE_SHA ile oluşturulmuştur. Debug imzalıdır; yüklemeden önce mevcut verilerinizi yedekleyin."

  publish-main:
    needs: [resolve, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: puanla-tablet-debug-apk
          path: dist
      - name: Publish only verified main APK
        env:
          GH_TOKEN: ${{ github.token }}
          COMPOSE_SHA: ${{ needs.resolve.outputs.compose_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.1-tablet.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "dist/app-debug.apk#Puanla-${TAG}-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Puanla 0.1.1 Tablet Önizleme" \
            --notes "Birim, APK derleme ve Android emülatör testleri başarılı. Compose Design System commit: $COMPOSE_SHA. Debug imzalıdır; yüklemeden önce verilerinizi yedekleyin."
