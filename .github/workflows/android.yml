name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compose_published_version:
        description: "Override pinned Maven Compose version (test only)"
        required: false
        type: string
      compose_legacy_sources:
        description: "Emergency rollback: use previously pinned Compose source SHA"
        required: false
        type: boolean
        default: false

# No hourly source-SHA promotion: the app now consumes immutable, pinned Maven versions.
concurrency:
  group: puanla-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned fallback source commit
        if: ${{ inputs.compose_legacy_sources == true }}
        id: pinned-source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < .github/compose-design-system.sha)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Invalid source rollback SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_composeLegacySources=true" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_composeDesignSystemDir=$GITHUB_WORKSPACE/compose-design-system/design-system" >> "$GITHUB_ENV"
      - name: Checkout source rollback revision (only on explicit request)
        if: ${{ inputs.compose_legacy_sources == true }}
        uses: actions/checkout@v4
        with:
          repository: knigdelioglu/compose-design-system
          ref: ${{ steps.pinned-source.outputs.sha }}
          path: compose-design-system
          persist-credentials: false
      - name: Apply explicit Maven version override (test only)
        if: ${{ inputs.compose_published_version != '' && inputs.compose_legacy_sources != true }}
        shell: bash
        env:
          VERSION: ${{ inputs.compose_published_version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "ORG_GRADLE_PROJECT_composePublishedVersion=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager"
          "$sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Build and unit-test with selected dependency
        run: ./gradlew test :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Enable KVM for tablet emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tablet interaction and accessibility UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Store verified APK
        uses: actions/upload-artifact@v4
        with:
          name: puanla-tablet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-main:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: puanla-tablet-debug-apk
          path: dist
      - name: Publish only validated main APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.1-tablet.${GITHUB_RUN_NUMBER}"
          version="$(sed -n 's/^composeDesignSystemVersion=//p' gradle.properties)"
          test -n "$version"
          gh release create "$tag" "dist/app-debug.apk#Puanla-${tag}-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Puanla 0.1.1 Tablet Önizleme" \
            --notes "Puanla birim, Android derleme ve tablet emülatör testleri başarılı. Compose Maven sürümü: $version. Debug imzalıdır; yüklemeden önce verilerinizi yedekleyin."
